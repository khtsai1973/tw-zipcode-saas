<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3+3 郵遞區號查詢</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2332;
      --muted: #5c6b7a;
      --paper: #f7f4ef;
      --card: #ffffff;
      --accent: #0b6e4f;
      --accent-2: #c45c26;
      --line: #d9d2c5;
      --ok: #0b6e4f;
      --warn: #b86e00;
      --bad: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #dceee6 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #f3e2d4 0%, transparent 50%),
        var(--paper);
      min-height: 100vh;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 40px 20px 72px; }
    header h1 {
      font-family: "IBM Plex Sans", "Noto Sans TC", sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    header p { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(26, 35, 50, 0.04);
    }
    .panel h2 { margin: 0 0 14px; font-size: 1.05rem; }
    label { display: block; font-size: 0.9rem; margin-bottom: 6px; color: var(--muted); }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      background: #fff;
      margin-bottom: 12px;
    }
    .row { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
    button {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      padding: 12px 18px;
      border-radius: 999px;
      cursor: pointer;
    }
    button.secondary { background: #2f3b4a; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .result {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f3f7f5;
      border: 1px dashed #b7d0c4;
      display: none;
    }
    .result.show { display: block; }
    .zip {
      font-family: "IBM Plex Sans", monospace;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    .meta { color: var(--muted); font-size: 0.92rem; margin-top: 6px; line-height: 1.5; }
    .tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .tag.exact { background: #d8f3e7; color: var(--ok); }
    .tag.district { background: #fff0d6; color: var(--warn); }
    .tag.not_found { background: #fde2e0; color: var(--bad); }
    .hint { font-size: 0.85rem; color: var(--muted); margin-top: 10px; }
    footer { margin-top: 28px; color: var(--muted); font-size: 0.82rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>3+3 郵遞區號查詢</h1>
      <p>單筆一鍵查詢，或上傳 CSV / Excel / ODS 批次補上 3+3 郵遞區號。輸入需含名稱與地址欄位，其餘欄位原樣保留。</p>
    </header>

    <section class="panel">
      <h2>單筆查詢</h2>
      <div class="row">
        <div>
          <label for="name">名稱（選填）</label>
          <input id="name" type="text" placeholder="王小明" />
        </div>
        <div>
          <label for="address">地址</label>
          <input id="address" type="text" placeholder="臺北市大安區愛國東路216號" value="臺北市大安區愛國東路216號" />
        </div>
      </div>
      <div class="actions">
        <button id="lookupBtn" type="button">一鍵查詢</button>
        <button class="secondary" id="sampleBtn" type="button">填入範例</button>
      </div>
      <div class="result" id="lookupResult"></div>
      <p class="hint">查詢順序：正規化 → 大宗專用郵遞區號 → 中華郵政 → 本地路段。大宗表在 backend/data/bulk_zipcodes.json。</p>
    </section>

    <section class="panel">
      <h2>檔案批次查詢（ETL）</h2>
      <label for="file">上傳檔案（.csv / .xlsx / .xls / .ods，最多 1000 筆）</label>
      <input id="file" type="file" accept=".csv,.xlsx,.xls,.ods" />
      <div class="actions">
        <button id="uploadBtn" type="button">上傳並查詢</button>
        <a id="downloadLink" href="#" style="display:none"></a>
      </div>
      <div class="result" id="jobResult"></div>
      <p class="hint">輸出會多「正規化地址」「3+3郵遞區號」「查詢狀態」欄，格式盡量與上傳相同（.xls 會輸出 .xlsx）。</p>
    </section>

    <footer>
      資料來源：本地路段庫 + 中華郵政 3+3 Web Service。查詢結果會快取以加速批次。正式大量商業用途請遵循中華郵政授權與介接規範。
    </footer>
  </div>

  <script>
    const samples = [
      "臺北市大安區愛國東路216號",
      "臺北市信義區信義路五段7號",
      "臺北市中山區南京東路二段100號",
      "新北市板橋區文化路一段188號",
      "新北市三重區重新路四段50號",
      "高雄市苓雅區四維三路2號",
      "高雄市左營區博愛二路777號",
      "臺中市西屯區臺灣大道三段99號",
      "臺中市北屯區崇德路二段200號",
      "臺南市東區大學路1號",
      "桃園市桃園區中正路100號",
      "新竹市東區光復路二段101號",
      "花蓮縣花蓮市中山路17號",
    ];

    function statusTag(status, source) {
      const map = { exact: "精確", district: "行政區", not_found: "查無" };
      let label = map[status] || status;
      if (source === "bulk") label = "大宗專用";
      const cls = source === "bulk" ? "exact" : status;
      return `<span class="tag ${cls}">${label}</span>`;
    }

    document.getElementById("sampleBtn").onclick = () => {
      const i = Math.floor(Math.random() * samples.length);
      document.getElementById("address").value = samples[i];
    };

    document.getElementById("lookupBtn").onclick = async () => {
      const btn = document.getElementById("lookupBtn");
      const box = document.getElementById("lookupResult");
      btn.disabled = true;
      try {
        const res = await fetch("/api/lookup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value || null,
            address: document.getElementById("address").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "查詢失敗");
        box.className = "result show";
        box.innerHTML = `
          <div class="zip">${data.zipcode || "—"} ${statusTag(data.status, data.source)}</div>
          <div class="meta">
            正規化：${data.normalized || "—"}<br/>
            來源：${data.source || "—"}　${data.message || ""}
          </div>`;
      } catch (err) {
        box.className = "result show";
        box.innerHTML = `<div class="meta">${err.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    };

    document.getElementById("uploadBtn").onclick = async () => {
      const fileInput = document.getElementById("file");
      const btn = document.getElementById("uploadBtn");
      const box = document.getElementById("jobResult");
      const link = document.getElementById("downloadLink");
      if (!fileInput.files.length) {
        box.className = "result show";
        box.innerHTML = `<div class="meta">請先選擇檔案</div>`;
        return;
      }
      const fd = new FormData();
      fd.append("file", fileInput.files[0]);
      btn.disabled = true;
      try {
        const res = await fetch("/api/jobs", { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail));
        const s = data.stats || {};
        box.className = "result show";
        box.innerHTML = `
          <div class="meta">
            任務完成：共 ${s.total ?? 0} 筆（精確 ${s.exact ?? 0} / 行政區 ${s.district ?? 0} / 查無 ${s.failed ?? 0}）<br/>
            地址欄：${s.address_column || "—"}　名稱欄：${s.name_column || "—"}
          </div>`;
        link.href = `/api/jobs/${data.id}/download`;
        link.textContent = "下載結果檔";
        link.style.display = "inline-block";
        link.style.marginLeft = "8px";
        link.style.color = "var(--accent)";
        link.style.fontWeight = "600";
      } catch (err) {
        box.className = "result show";
        box.innerHTML = `<div class="meta">${err.message}</div>`;
        link.style.display = "none";
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
